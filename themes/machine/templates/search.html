{% extends "base.html" %}
{% set active_menu = "search" %}

{% block title %}Search &middot; {{ SITENAME }}{% endblock %}

<input id="search-input" class="search-input" type="search" placeholder="search posts &crarr;" aria-label="Search posts" autocomplete="off" autofocus data-index="{{ SITEURL }}/search.json">

{% endblock %}
